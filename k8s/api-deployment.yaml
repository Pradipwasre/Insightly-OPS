# The API (FastAPI + LangGraph agents). AWS access (S3 read, CloudWatch metrics) comes from
# the EKS Pod Identity association for this ServiceAccount (infra/eks.tf) - no keys in the pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: insightly-api
  namespace: insightly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insightly-api
  namespace: insightly
  labels: { app: insightly-api, app.kubernetes.io/part-of: insightly }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app: insightly-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # zero-downtime deploys
  template:
    metadata:
      labels: { app: insightly-api, app.kubernetes.io/part-of: insightly }
    spec:
      serviceAccountName: insightly-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: insightly-api } }
      containers:
        - name: api
          image: ${ECR_REGISTRY}/insightly-api:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: insightly-config }
          env:
            - { name: ANTHROPIC_API_KEY, valueFrom: { secretKeyRef: { name: insightly-secrets, key: ANTHROPIC_API_KEY } } }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: insightly-secrets, key: DATABASE_URL } } }
            - { name: MEMORY_URL, valueFrom: { secretKeyRef: { name: insightly-secrets, key: MEMORY_URL } } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: insightly-api
  namespace: insightly
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: insightly-api }
