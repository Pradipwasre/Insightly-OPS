# Scale on CPU. The API is I/O-bound on LLM calls, so memory is watched too.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insightly-api
  namespace: insightly
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: insightly-api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insightly-ui
  namespace: insightly
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: insightly-ui }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 75 } }
