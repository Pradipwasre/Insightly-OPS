# Secrets live in AWS Secrets Manager, never in git or in the images.
# The External Secrets Operator (installed by deploy_eks.sh) copies them into the
# Kubernetes Secret "insightly-secrets" and refreshes it every hour.
#   ${NAME}/anthropic  plain string: your ANTHROPIC_API_KEY (you set it once with the AWS CLI)
#   ${NAME}/db         JSON written by Terraform: database URLs + read-only password
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
      # no auth block: the operator uses its EKS Pod Identity role (infra/secrets.tf)
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: insightly-secrets
  namespace: insightly
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: insightly-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: { key: "${NAME}/anthropic" }
    - secretKey: DATABASE_URL            # read-only user: what the agents query with
      remoteRef: { key: "${NAME}/db", property: readonly_url }
    - secretKey: MEMORY_URL              # chat memory (LangGraph checkpoints) needs writes
      remoteRef: { key: "${NAME}/db", property: admin_url }
    - secretKey: ADMIN_DATABASE_URL      # used only by the ingest Job
      remoteRef: { key: "${NAME}/db", property: admin_url }
    - secretKey: DB_READONLY_PASSWORD
      remoteRef: { key: "${NAME}/db", property: readonly_password }
